# Judgment rules for variants.yaml — the default baseline and the layered deltas.
layering:
  guidelines:
    - must: "author each variant as only its diff from `default` — the resolved state is every matching variant layered onto the default in order"
      should: "omit a variant whose diff is empty"
      adr: 34
configuration:
  guidelines:
    - warn: "an absent prop key inherits; a `null` value overrides with unset — different statements, not interchangeable"
      adr: 80
