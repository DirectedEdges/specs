# Judgment rules for api.yaml props.* — consistency with the catalogue is graded.
naming:
  rules:
    reuse-catalogue-vocabulary:
      rule: reuse an existing prop name and value set when the concept matches (analysis/props.yaml); never coin a synonym
    match-value-casing:
      rule: enum value casing follows the catalogue's existing values (e.g. Capitalized words, sizes XS/S/M/L/XL)
