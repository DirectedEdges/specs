# Judgment rules for api.yaml props.* — consistency with the catalogue is graded.
naming:
  vocabulary:
    should: "reuse an existing prop name and value set when the concept matches (`analysis/props.yaml`)"
    never: "coin a synonym for a prop the system already has (`text` where the catalogue says `label`)"
  value-casing:
    should: "follow the catalogue's enum value casing (Capitalized words; sizes `XS`/`S`/`M`/`L`/`XL`)"
configuration:
  null-vs-absent:
    warn: "an absent prop key inherits; a `null` value overrides with unset — different statements, not interchangeable"
    adr: 80
