# ADR-046 Option D — Flat registry, entries use `parts` wrapper
#
# Each registry entry carries title?, description?, and a required `parts`
# record. `parts.main` is the reserved primary fragment; additional sibling
# keys hold related slot fills authored alongside it.
#
# References use { $slotContent: <JSON Pointer> }. Composition-level pointers
# resolve to the entry's `main` fragment (via convention, not structural rule).
# Fragment-deep pointers target a specific sibling inside `parts`.
#
# Compare with option-a-inline, option-b-groups, option-c-slotcontent —
# same Filter Results Page hierarchy, different registry shapes.
#
# Why this option loses (see ADR-046 Option D rejection):
#   - `parts` is a new reserved key with no precedent in ADR-042 or ADR-047
#   - `main` is still a reserved key inside a free-form record —
#     same reservation problem as Option B's `groups.main`
#   - `parts` name implies structural sub-division, not slot fill bundling;
#     it invites confusion with the Component.anatomy "parts" mental model
#   - No advantage over Option B (groups) except a different wrapper name —
#     all the same drawbacks apply

compositions:

  # ─── root: entry point — fills Page.body ──────────────────────────────────
  root:
    title: Filter Results Page
    description: |
      Two-row layout — page header above filter grid.
    parts:
      main:                            # reserved primary fragment
        anatomy:
          filterPageHeader: { type: instance, instanceOf: Row }
          filterGrid:       { type: instance, instanceOf: Row }
        elements:
          filterPageHeader:
            propConfigurations:
              children:
                $slotContent: "#/compositions/root/parts/pageHeader"
          filterGrid:
            propConfigurations:
              children:
                $slotContent: "#/compositions/pageGrid/parts/main"
        layout: [filterPageHeader, filterGrid]
      pageHeader:                      # sibling fill — bundled with main
        anatomy:
          breadcrumbs: { type: instance, instanceOf: Breadcrumbs }
          heading:     { type: instance, instanceOf: Heading }
          tabs:        { type: instance, instanceOf: Tabs }
        elements:
          heading:
            propConfigurations:
              content: Filter Results
        layout: [breadcrumbs, heading, tabs]

  # ─── pageGrid: two-column grid ────────────────────────────────────────────
  pageGrid:
    parts:
      main:
        anatomy:
          sidebar: { type: container }
          make:    { type: instance, instanceOf: Accordion }
          main:    { type: container }
          card1:   { type: instance, instanceOf: Card }
          card2:   { type: instance, instanceOf: Card }
          card3:   { type: instance, instanceOf: Card }
          card4:   { type: instance, instanceOf: Card }
        elements:
          make:
            propConfigurations:
              label: Filter 1
              open: true
              children:
                $slotContent: "#/compositions/carBrandFilter/parts/main"
        layout:
          - sidebar:
              - make
          - main:
              - card1
              - card2
              - card3
              - card4

  # ─── carBrandFilter: Accordion contents ───────────────────────────────────
  carBrandFilter:
    parts:
      main:
        anatomy:
          checkboxGroup: { type: instance, instanceOf: CheckboxGroup }
        elements:
          checkboxGroup:
            propConfigurations:
              children:
                $slotContent: "#/compositions/makeOptions/parts/main"
        layout: [checkboxGroup]

  # ─── makeOptions: three Checkbox instances ────────────────────────────────
  makeOptions:
    parts:
      main:
        anatomy:
          make1: { type: instance, instanceOf: Checkbox }
          make2: { type: instance, instanceOf: Checkbox }
          make3: { type: instance, instanceOf: Checkbox }
        elements:
          make1: { propConfigurations: { label: Ford } }
          make2: { propConfigurations: { label: Mercedes } }
          make3:
            propConfigurations:
              custom: true
              children:
                $slotContent: "#/compositions/newToyota/parts/main"
        layout: [make1, make2, make3]

  # ─── newToyota: text + badge inside the custom Toyota checkbox ────────────
  newToyota:
    parts:
      main:
        anatomy:
          root:       { type: container }
          toyotaText: { type: text }
          newBadge:   { type: instance, instanceOf: Badge }
        elements:
          root:
            styles: { layoutMode: HORIZONTAL }
          toyotaText:
            content: Toyota
          newBadge:
            propConfigurations:
              appearance: new
              label: New
        layout:
          - root:
              - toyotaText
              - newBadge
