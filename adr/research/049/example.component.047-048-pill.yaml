# ADR-047 + ADR-048 example — Pill component
#
# Demonstrates Component.slotContentExamples (ADR-047), Component.instanceExamples
# (ADR-048), and PropConfigurations with SlotContentRef (ADR-049) in combination.
#
# Pill component contract:
#   prop  custom:   boolean    — toggles which variant is active
#   prop  label:    string     — bound to a text layer when custom:false
#   prop  children: slot       — slot-bound container when custom:true
#
#   Variant custom:false — labelText layer's characters bound to `label` prop
#                          via PropBinding (ADR-008).
#   Variant custom:true  — childrenSlot's children bound via SlotBinding
#                          (ADR-047). Figma authoring default points to the
#                          `composedLabel` entry in slotContentExamples.
#
# Three documented usages cover the surface (instanceExamples below):
#   1. configuredLabel — custom:false + label scalar
#   2. composedLabel   — custom:true + children filled by composedLabel slot content
#   3. removableLabel  — custom:true + children filled by removableLabelContent

components:
  pill:
    title: Pill

    anatomy:
      root:
        type: container
      labelText:
        type: text          # rendered when custom:false; characters bound to label prop
      childrenSlot:
        type: container     # rendered when custom:true; slot-bound

    props:
      custom:
        type: boolean
      label:
        type: string
      children:
        type: slot

    # ─── default variant (custom:false): text layer bound to label prop ─────
    default:
      configuration:
        custom: false
      elements:
        root:
          children: [labelText]
        labelText:
          content: { $binding: "#/components/pill/props/label" }   # ADR-008 PropBinding
      layout:
        - root:
            - labelText

    # ─── variants[0] (custom:true): children slot rendered ──────────────────
    variants:
      - configuration:
          custom: true
        elements:
          root:
            children: [childrenSlot]
          childrenSlot:
            children:                                              # ADR-047 SlotBinding
              $binding: "#/components/pill/props/children"
              $extensions:
                com.figma:
                  default: "#/components/pill/slotContentExamples/composedLabel"   # Figma authoring default
        layout:
          - root:
              - childrenSlot

    # ─── Component.slotContentExamples (ADR-047): named slot fill examples ──
    slotContentExamples:
      # Figma's authoring default for the children slot. Reused by the
      # `composedLabel` InstanceExample below.
      composedLabel:
        anatomy:
          label:
            type: text
        elements:
          label:
            content: "{composed label}"
        layout: [label]

      # Text + remove-x glyph. Referenced from the `removableLabel` InstanceExample.
      removableLabelContent:
        anatomy:
          label:
            type: text
          removeIcon:
            type: glyph
        elements:
          label:
            content: "{removeable label}"
          removeIcon:
            content: x
            styles:
              width: 16
              height: 16
        layout: [label, removeIcon]

    # ─── Component.instanceExamples (ADR-048): documented whole-component usages
    instanceExamples:
      configuredLabel:
        title: Pill with configured label
        propConfigurations:
          custom: false
          label: "{configured label}"                              # scalar prop value

      composedLabel:
        title: Pill using the default composed label
        propConfigurations:
          custom: true
          children:
            $slotContent: "#/components/pill/slotContentExamples/composedLabel"   # SlotContentRef (ADR-046)

      removableLabel:
        title: Pill with text + remove glyph
        propConfigurations:
          custom: true
          children:
            $slotContent: "#/components/pill/slotContentExamples/removableLabelContent"
