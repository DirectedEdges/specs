# Scratchpad: cross-ADR alternative — CheckboxGroup component
#
# Sibling to example.pill.yaml. Same component-scoped machinery (ADR-042
# Composition, ADR-046 InstanceExamples, ADR-047 slotContent, ADR-049
# $composition references), but pushed one level deeper: a slot fill whose
# items themselves nest custom slot content.
#
# Alternative shape under exploration here:
#   Instead of two sibling fields on Component — `slotContent` (ADR-047) and
#   `instanceExamples` (ADR-046) — consolidate both into a single named record
#   `examples` whose entries discriminate by `kind`:
#
#     kind: instance            — InstanceExample (ADR-046):
#                                 whole-component usage; scalar +
#                                 $composition references on propConfigurations
#     kind: slotContent         — Composition (ADR-047): named content that
#                                 fills one of THIS component's slots
#     kind: nestedSlotContent   — Composition that fills the slot of an
#                                 INSTANCE living inside a slotContent entry.
#                                 Same structural shape as slotContent; the
#                                 distinct kind names the recursion role so
#                                 tooling can tell "fills my slot" from
#                                 "fills a nested instance's slot" without
#                                 inspecting reference sites.
#
# Reference form (unchanged from example.pill.yaml): JSON Pointer, absolute
# from the document root, paralleling ADR-008 $binding. With the consolidation
# above, every pointer into this component's compositions resolves under
# `#/components/checkboxGroup/examples/<key>` rather than splitting between
# `/slotContent/<key>` and `/instanceExamples/<key>`.
#
# CheckboxGroup component contract:
#   prop  children: slot       — slot-bound container holding Checkbox items
#
#   Variant default — childrenSlot's children bound via SlotBinding
#                     (ADR-047). Figma authoring default points to the
#                     `defaultCheckboxes` slotContent entry — three plain
#                     Checkbox instances with their own label props set.
#
# Checkbox contract (referenced; not authored here):
#   prop  label:    string     — bound to the standard checkbox label
#   prop  custom:   boolean    — toggles which variant is active (mirrors Pill)
#   prop  children: slot       — rendered when custom:true
#
# Two documented usages cover the surface (kind:instance entries below):
#   1. plainGroup   — three checkboxes with label scalars (no custom children)
#   2. requiredGroup— three checkboxes, each with custom:true and children
#                     filled by the shared `requiredLabel` nestedSlotContent
#                     (a label text + requiredAsterisk laid out horizontally).
#
# Layout of the examples record (semantic, not file order):
#
#   examples/
#     defaultCheckboxes       kind: slotContent       ← Figma slot default
#     requiredCheckboxes      kind: slotContent       ← fills children for requiredGroup
#     requiredLabel           kind: nestedSlotContent ← fills each Checkbox.children
#     plainGroup              kind: instance          ← whole-component usage
#     requiredGroup           kind: instance          ← whole-component usage

components:
  checkboxGroup:
    title: Checkbox Group

    anatomy:
      root:
        type: container
      childrenSlot:
        type: container     # slot-bound

    props:
      children:
        type: slot

    # ─── default variant: children slot rendered, Figma default supplied ────
    default:
      elements:
        root:
          children: [childrenSlot]
        childrenSlot:
          children:                                              # ADR-047 SlotBinding
            $binding: "#/components/checkboxGroup/props/children"
            $extensions:
              com.figma:
                default: "#/components/checkboxGroup/examples/defaultCheckboxes"   # Figma authoring default
      layout:
        - root:
            - childrenSlot

    # ─── Component.examples (consolidated ADR-046 + ADR-047 + ADR-049) ──────
    examples:

      # Figma's authoring default for the children slot. Three plain Checkbox
      # instances; each sets its own scalar `label` prop, none use custom
      # children. Also referenced by the `plainGroup` InstanceExample below.
      defaultCheckboxes:
        kind: slotContent
        title: Default three checkboxes
        anatomy:
          checkbox1: { type: instance, instanceOf: Checkbox }
          checkbox2: { type: instance, instanceOf: Checkbox }
          checkbox3: { type: instance, instanceOf: Checkbox }
        elements:
          checkbox1:
            propConfigurations:
              label: Ford
          checkbox2:
            propConfigurations:
              label: Mercedes
          checkbox3:
            propConfigurations:
              label: Toyota
        layout:
          - checkbox1
          - checkbox2
          - checkbox3

      # NestedSlotContent: a label text with a requiredAsterisk to its right.
      # Slot-agnostic (per ADR-047) — referenced from each of the three
      # Checkbox.children fills inside `requiredCheckboxes`. The "nested"
      # kind names its role: it fills a slot on an instance that itself
      # lives inside a slotContent entry on this component.
      requiredLabel:
        kind: nestedSlotContent
        title: Label with required asterisk
        anatomy:
          root:             { type: container }
          label:            { type: text }
          requiredAsterisk: { type: glyph }
        elements:
          root:
            styles:
              layoutMode: HORIZONTAL
          label:
            content: "{required label}"
          requiredAsterisk:
            content: "*"
        layout:
          - root:
              - label
              - requiredAsterisk

      # SlotContent for `requiredGroup`: three Checkbox instances, each with
      # custom:true and a children fill pointing at the shared `requiredLabel`
      # nestedSlotContent above. One nested-content definition; three uses.
      requiredCheckboxes:
        kind: slotContent
        title: Three checkboxes with required-label custom children
        anatomy:
          checkbox1: { type: instance, instanceOf: Checkbox }
          checkbox2: { type: instance, instanceOf: Checkbox }
          checkbox3: { type: instance, instanceOf: Checkbox }
        elements:
          checkbox1:
            propConfigurations:
              custom: true
              children:
                $composition: "#/components/checkboxGroup/examples/requiredLabel"   # ADR-049
          checkbox2:
            propConfigurations:
              custom: true
              children:
                $composition: "#/components/checkboxGroup/examples/requiredLabel"
          checkbox3:
            propConfigurations:
              custom: true
              children:
                $composition: "#/components/checkboxGroup/examples/requiredLabel"
        layout:
          - checkbox1
          - checkbox2
          - checkbox3

      # InstanceExample (ADR-046) — whole-component usage with the default,
      # un-customized slot fill. Same content Figma renders by default; named
      # here so documentation tooling has an addressable handle on it.
      plainGroup:
        kind: instance
        title: CheckboxGroup with three plain checkboxes
        propConfigurations:
          children:
            $composition: "#/components/checkboxGroup/examples/defaultCheckboxes"   # ADR-049

      # InstanceExample (ADR-046) — whole-component usage with the
      # required-label slot fill. Resolves through two layers:
      #   children → requiredCheckboxes (slotContent)
      #            → each checkbox.children → requiredLabel (nestedSlotContent)
      requiredGroup:
        kind: instance
        title: CheckboxGroup with three required-label checkboxes
        propConfigurations:
          children:
            $composition: "#/components/checkboxGroup/examples/requiredCheckboxes"
