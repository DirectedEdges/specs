# Scratchpad: ADR 049 — Nested Slot Compositions (NESTED FORM)
#
# Compare with ./example.flat.yaml — same hierarchy, flat form (named
# compositions referenced by key from propConfigurations).
#
# Example: Filter Results Page rendered through deeply-nested component
# instances. This Composition fills `Page.body`. Each nested instance has its
# own slot prop(s) whose values are themselves Compositions written inline,
# producing growing indentation as the tree deepens — the readability problem
# ADR-049 must address.
#
# Framing — slots fill through propConfigurations:
#   A slot is a prop (type: "slot"). Filling a slot means setting that prop's
#   value, the same way a scalar prop is set. So instead of a separate `slots:`
#   field on Element, this example uses `propConfigurations: { <slotName>: ... }`
#   where the value is a Composition (or, eventually, a key-ref into a
#   slotContent registry).
#
# Implication for ADR-046:
#   `InstanceExample.slots: Record<string, string>` may be redundant — it could
#   merge into `propConfigurations` if we widen propConfigurations' value union
#   to accept Composition (and/or a slotContent-key string typed as such).
#   Worth raising as a follow-up.
#
# Open syntactic questions (for ADR-049 to resolve):
#   - Inline Composition (as written) vs. key-ref into a Component.slotContent
#     registry, vs. both forms accepted on the same field?
#   - Value-union for `propConfigurations[slotName]` — which forms are valid?
#     (Composition object, slotContent key, PropBinding pass-through, ...)
#   - Should layout-tree nesting (e.g. `- sidebar: [make]`) be allowed,
#     or must children always be declared on the container element?
#   - What enforces or expresses recursion depth? Is there a cap?
#
# Hierarchy:
#   Page.body
#     ├─ Row "Filter Page Header" (Row.children)
#     │    ├─ Breadcrumbs
#     │    ├─ Heading
#     │    └─ Tabs
#     └─ Row "Filter Grid" (Row.children)
#          ├─ Sidebar (container)
#          │    └─ Accordion (label="Filter 1", open=true)  ← Accordion.children
#          │         └─ CheckboxGroup                        ← CheckboxGroup.children
#          │              ├─ Checkbox (label="Ford")
#          │              ├─ Checkbox (label="Mercedes")
#          │              └─ Checkbox (custom=true)              ← Checkbox.children
#          │                   ├─ Text "Toyota"
#          │                   └─ Badge (appearance=new, label="New")
#          └─ Main (container)
#               ├─ Card
#               ├─ Card
#               ├─ Card
#               └─ Card

title: Filter Results Page
description: |
  Two-row page layout — "Filter Page Header" (breadcrumbs, heading, tabs)
  above "Filter Grid" (sidebar with an Accordion of Checkboxes, main with
  four Cards). Used to demonstrate the recursion needs of ADR-049.

anatomy:
  filterPageHeader:
    type: instance
    instanceOf: Row
  filterGrid:
    type: instance
    instanceOf: Row

elements:
  filterPageHeader:
    propConfigurations:
      # Row.children slot — value is a Composition
      children:
        anatomy:
          breadcrumbs: { type: instance, instanceOf: Breadcrumbs }
          heading:     { type: instance, instanceOf: Heading }
          tabs:        { type: instance, instanceOf: Tabs }
        elements:
          heading:
            propConfigurations:
              content: Filter Results
        layout:
          - breadcrumbs
          - heading
          - tabs

  filterGrid:
    propConfigurations:
      # Row.children slot — value is a Composition
      children:
        anatomy:
          sidebar:   { type: container }
          make: { type: instance, instanceOf: Accordion }
          main:      { type: container }
          card1:     { type: instance, instanceOf: Card }
          card2:     { type: instance, instanceOf: Card }
          card3:     { type: instance, instanceOf: Card }
          card4:     { type: instance, instanceOf: Card }
        elements:
          make:
            propConfigurations:
              label: Filter 1
              open: true
              # Accordion.children slot — value is a Composition (recursion ↓)
              children:
                anatomy:
                  checkboxGroup:
                    type: instance
                    instanceOf: CheckboxGroup
                elements:
                  checkboxGroup:
                    propConfigurations:
                      # CheckboxGroup.children slot — value is a Composition (recursion ↓)
                      children:
                        anatomy:
                          make1:     { type: instance, instanceOf: Checkbox }
                          make2: { type: instance, instanceOf: Checkbox }
                          make3:   { type: instance, instanceOf: Checkbox }
                        elements:
                          make1:     { propConfigurations: { label: Ford } }
                          make2: { propConfigurations: { label: Mercedes } }
                          make3:
                            propConfigurations:
                              custom: true
                              # Checkbox.children slot — value is a Composition (recursion ↓)
                              children:
                                anatomy:
                                  root:        { type: container }
                                  toyotaText: { type: text }
                                  newBadge:   { type: instance, instanceOf: Badge }
                                elements:
                                  root:
                                    styles:
                                      layoutMode: HORIZONTAL
                                  toyotaText:
                                    content: Toyota
                                  newBadge:
                                    propConfigurations:
                                      appearance: new
                                      label: New
                                layout:
                                  - root:
                                      - toyotaText
                                      - newBadge
                        layout:
                          - make1
                          - make2
                          - make3
                layout:
                  - checkboxGroup
        layout:
          - sidebar:
              - make
          - main:
              - card1
              - card2
              - card3
              - card4

layout:
  - filterPageHeader
  - filterGrid
