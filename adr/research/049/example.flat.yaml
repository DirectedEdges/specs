# Scratchpad: ADR 049 — Nested Slot Compositions (FLAT FORM)
#
# Compare with ./example.nested.yaml — same hierarchy, nested form
# (Compositions written inline as the value of `propConfigurations.<slotName>`).
#
# Scope: this file represents a SYSTEM-SCOPED composition file (an entire page
# spanning multiple components — Page, Row, Accordion, CheckboxGroup, Checkbox,
# Badge). Component-scoped recursive compositions (a single component's
# `slotContent` referencing its own sibling entries) would live inside the
# Component definition rather than in a standalone file like this one.
#
# Reference form: discriminated — `{ $slotContent: <key> }` — paralleling
# `PropBinding`'s `$binding` shape. The bare-string alternative (`children:
# pageHeader`) is the lighter form but loses local type-discriminability;
# see ADR-049 Context decision 2.
#
# Example: Filter Results Page expressed as a record of named Compositions.
# `root` is the entry point (the Composition that fills `Page.body`); every
# other key is a sibling Composition referenced by name from another's
# `propConfigurations.<slotName>` field. No indentation grows with depth —
# each composition stays at file-top level regardless of how deep in the
# tree its referencer sits.
#
# Framing — slot fill is by key reference:
#   `propConfigurations.<slotName>: <key>` where `<key>` names a Composition
#   defined as a sibling record in this file. The schema-level value union
#   for `propConfigurations.<slotName>` therefore needs to accept *at least*
#   a string key (this form) and ideally also an inline Composition (nested
#   form), letting authors choose per case.
#
# Why flat:
#   - Each Composition is reusable — `makeOptions` could be referenced
#     from any number of CheckboxGroup fills, not just this one
#   - Indentation stays bounded; deep trees stay readable
#   - Compositions become inspectable / addressable as named units
#   - Naming forces authors to describe what each piece *is*, not just where
#     it's used
#
# Why nested:
#   - Locality: the entire tree is visible without jumping between records
#   - No naming overhead for one-off sub-compositions
#   - Matches how a designer might think about a one-off page layout
#
# Open questions for ADR-049 (carry-over from example.nested.yaml plus
# flat-specific):
#   - Accept both inline-Composition and key-ref forms for
#     `propConfigurations.<slotName>`, or pick one?
#   - Where do the named compositions live — inside `Component.slotContent`,
#     a separate `compositions.yaml` file (per ADR-042 follow-on), or both?
#   - Naming conventions / collision rules for the registry?
#   - How does the schema express the union (Composition | string) when the
#     string is meaningful only as a key into a separate registry?
#
# Hierarchy (same as example.nested.yaml):
#   Page.body
#     ├─ Row "Filter Page Header" (Row.children)
#     │    ├─ Breadcrumbs
#     │    ├─ Heading
#     │    └─ Tabs
#     └─ Row "Filter Grid" (Row.children)
#          ├─ Sidebar (container)
#          │    └─ Accordion (label="Filter 1", open=true)  ← Accordion.children
#          │         └─ CheckboxGroup                        ← CheckboxGroup.children
#          │              ├─ Checkbox (label="Ford")
#          │              ├─ Checkbox (label="Mercedes")
#          │              └─ Checkbox (custom=true)              ← Checkbox.children
#          │                   ├─ Text "Toyota"
#          │                   └─ Badge (appearance=new, label="New")
#          └─ Main (container)
#               ├─ Card
#               ├─ Card
#               ├─ Card
#               └─ Card

# ─── root: entry point — fills Page.body ────────────────────────────────────
root:
  title: Filter Results Page
  description: |
    Two-row page layout — "Filter Page Header" (breadcrumbs, heading, tabs)
    above "Filter Grid" (sidebar with an Accordion of Checkboxes, main with
    four Cards).
  anatomy:
    filterPageHeader:
      type: instance
      instanceOf: Row
    filterGrid:
      type: instance
      instanceOf: Row
  elements:
    filterPageHeader:
      propConfigurations:
        children: { $slotContent: pageHeader }        # → composition `pageHeader`
    filterGrid:
      propConfigurations:
        children: { $slotContent: pageGrid }          # → composition `pageGrid`
  layout:
    - filterPageHeader
    - filterGrid

# ─── pageHeader: three stacked items in the header row ──────────────────────
pageHeader:
  anatomy:
    breadcrumbs: { type: instance, instanceOf: Breadcrumbs }
    heading:     { type: instance, instanceOf: Heading }
    tabs:        { type: instance, instanceOf: Tabs }
  elements:
    heading:
      propConfigurations:
        content: Filter Results
  layout:
    - breadcrumbs
    - heading
    - tabs

# ─── pageGrid: two-column grid for the filter results ───────────────────────
pageGrid:
  anatomy:
    sidebar:   { type: container }
    make: { type: instance, instanceOf: Accordion }
    main:      { type: container }
    card1:     { type: instance, instanceOf: Card }
    card2:     { type: instance, instanceOf: Card }
    card3:     { type: instance, instanceOf: Card }
    card4:     { type: instance, instanceOf: Card }
  elements:
    make:
      propConfigurations:
        label: Filter 1
        open: true
        children: { $slotContent: carBrandFilter }    # → composition `carBrandFilter`
  layout:
    - sidebar:
        - make
    - main:
        - card1
        - card2
        - card3
        - card4

# ─── carBrandFilter: what's inside the "Filter 1" Accordion when open ───────
carBrandFilter:
  anatomy:
    checkboxGroup:
      type: instance
      instanceOf: CheckboxGroup
  elements:
    checkboxGroup:
      propConfigurations:
        children: { $slotContent: makeOptions }   # → composition `makeOptions`
  layout:
    - checkboxGroup

# ─── makeOptions: the three Checkbox instances inside the CheckboxGroup ─
makeOptions:
  anatomy:
    make1:     { type: instance, instanceOf: Checkbox }
    make2: { type: instance, instanceOf: Checkbox }
    make3:   { type: instance, instanceOf: Checkbox }
  elements:
    make1:     { propConfigurations: { label: Ford } }
    make2: { propConfigurations: { label: Mercedes } }
    make3:
      propConfigurations:
        custom: true
        children: { $slotContent: newToyota }  # → composition `newToyota`
  layout:
    - make1
    - make2
    - make3

# ─── newToyota: text + badge inside the custom Toyota checkbox ──────
newToyota:
  anatomy:
    root:        { type: container }
    toyotaText: { type: text }
    newBadge:   { type: instance, instanceOf: Badge }
  elements:
    root:
      styles:
        layoutMode: HORIZONTAL
    toyotaText:
      content: Toyota
    newBadge:
      propConfigurations:
        appearance: new
        label: New
  layout:
    - root:
        - toyotaText
        - newBadge
